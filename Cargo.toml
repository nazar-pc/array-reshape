[package]
name = "array-reshape"
description = "Reshape arrays by value, by reference and by mutable reference in const fn"
keywords = ["array", "reshape", "flatten", "const", "no-std"]
categories = ["rust-patterns", "no-std::no-alloc"]
repository = "https://github.com/nazar-pc/array-reshape"
license = "0BSD"
version = "0.1.1"
authors = ["Nazar Mokrynskyi <nazar@mokrynskyi.com>"]
edition = "2024"
rust-version = "1.85"
include = [
    "/src",
    "/tests",
    "/Cargo.toml",
    "/CHANGELOG.md",
    "/README.md",
]

[package.metadata.docs.rs]
all-features = true

[features]
# Makes all traits const traits, requires nightly Rust
const-trait = []

[lints.rust]
rust_2018_idioms = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Conversions compile into nothing, so they should always be inlined, even in debug builds
inline_always = "allow"
